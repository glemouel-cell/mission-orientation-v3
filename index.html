</style></head><body><div class="app"><header class="top"><div class="brand">🧭 Mission Orientation</div><button class="menu" onclick="privacy()">⋯</button></header><div class="progress"><div id="bar"></div></div><main id="s"></main></div><script>
const Q=[
['TES MOTEURS','Qu’est-ce qui te motive le plus au quotidien ?',[['Me dépasser, réussir et atteindre mes objectifs',{perf:3,auto:1}],['Aider les autres, avoir un impact positif',{impact:3,coll:1}],['Comprendre, analyser, résoudre des problèmes',{ana:3,cur:1}],['Créer, imaginer, exprimer des idées',{crea:3,auto:1}],['Être libre, choisir ma propre voie',{auto:3,perf:1}]]],
['TES MOTEURS','Quand tu apprends quelque chose de nouveau, ce qui t’attire le plus est…',[['Comprendre comment ça fonctionne',{ana:3,cur:2}],['Voir immédiatement à quoi ça peut servir',{impact:2,auto:1}],['Devenir meilleur que la veille',{perf:3}],['Trouver une manière originale de le faire',{crea:3}],['Pouvoir ensuite l’expliquer ou l’apprendre à d’autres',{coll:2,cur:2}]]],
['TES MOTEURS','Dans un projet, tu préfères surtout…',[['Avoir un objectif ambitieux',{perf:3}],['Pouvoir décider comment y arriver',{auto:3}],['Construire quelque chose de nouveau',{crea:3}],['Résoudre un problème complexe',{ana:3}],['Faire réussir une équipe',{lead:2,coll:3}]]],
['MISE EN SITUATION','Ton équipe est menée d’un point à 5 minutes de la fin. Tu es capitaine. Que fais-tu spontanément ?',[['Je prends la responsabilité et donne une consigne claire',{lead:3,perf:2}],['Je cherche l’idée tactique qui peut faire basculer le match',{ana:2,cur:2}],['Je remobilise tout le monde et fais monter l’énergie',{coll:3,lead:2}],['Je demande à chacun ce qu’il pense avant de décider',{coll:2,cur:2}],['Je me concentre sur mon propre jeu pour faire la différence',{perf:3,auto:1}]]],
['MISE EN SITUATION','Deux personnes de ton équipe sont en désaccord et le projet avance mal. Tu fais quoi ?',[['Je tranche si nécessaire',{lead:3,perf:1}],['Je cherche qui a les meilleurs arguments',{ana:3}],['Je les fais discuter jusqu’à trouver un compromis',{coll:3,impact:1}],['Je cherche la cause profonde du conflit',{cur:3,ana:1}],['Je répartis autrement les responsabilités',{lead:2,auto:2}]]],
['MISE EN SITUATION','On te donne trois semaines pour construire quelque chose qui n’existe pas. Ta première réaction ?',[['Je découpe le problème et construis une méthode',{ana:3}],['J’imagine immédiatement le résultat final',{crea:3}],['Je réunis une équipe et répartis les rôles',{lead:2,coll:3}],['Je cherche quelqu’un qui maîtrise déjà le sujet',{cur:2,coll:1}],['Je teste une première version très vite',{auto:2,perf:2}]]],
['LEADERSHIP','Quel type de leader serais-tu le plus naturellement ?',[['Celui qui fixe le cap et prend les décisions',{lead:3}],['Celui qui fait grandir les autres',{coll:3,impact:2}],['Celui qui trouve la stratégie gagnante',{ana:2,perf:2}],['Celui qui donne envie de le suivre',{lead:2,coll:2}],['Celui qui montre l’exemple par son exigence',{perf:3,lead:1}]]],
['LEADERSHIP','Quelle phrase te ressemble le plus ?',[['J’aime être celui sur qui on peut compter pour décider.',{lead:3}],['J’aime convaincre sans forcément avoir le dernier mot.',{impact:2,coll:2}],['Je préfère être le meilleur spécialiste plutôt que le chef.',{ana:2,perf:2}],['J’aime construire un groupe qui fonctionne vraiment bien.',{coll:3}],['J’aime lancer des projets et voir jusqu’où ils peuvent aller.',{auto:3,perf:2}]]],
['RISQUE & AMBITION','Tu dois choisir entre deux projets.',[['90 % de chances de réussite, mais assez classique.',{ana:1,auto:1}],['40 % de chances de réussite, mais potentiel énorme.',{perf:3,auto:2,crea:1}]]],
['RISQUE & AMBITION','Dans 10 ans, quelle phrase te ferait le plus plaisir ?',[['Je suis devenu extrêmement compétent dans mon domaine.',{ana:3,cur:1}],['J’ai construit quelque chose dont je suis fier.',{crea:2,auto:3}],['Des personnes me font confiance et j’ai une vraie responsabilité.',{lead:3,coll:1}],['J’ai atteint un niveau que peu de gens atteignent.',{perf:3}],['Je suis libre de choisir ma vie.',{auto:3}]]],
['RISQUE & AMBITION','Si tu savais que tu ne pouvais pas échouer pendant un an, que tenterais-tu ?',[['Un projet entrepreneurial',{auto:3,perf:2,crea:2}],['Une compétition sportive de très haut niveau',{perf:3,auto:1}],['Un projet scientifique ou technologique',{ana:3,cur:2}],['Un projet artistique ou créatif',{crea:3,auto:1}],['Un projet collectif qui change quelque chose',{impact:3,lead:2,coll:2}]]],
['RUGBY & PERFORMANCE','Dans le rugby, qu’est-ce qui te donne le plus envie de progresser ?',[['Voir mon niveau monter et battre mes propres limites',{perf:3}],['Être un joueur sur lequel l’équipe peut compter',{coll:3,impact:1}],['Comprendre le jeu et prendre les bonnes décisions',{ana:3}],['Prendre des responsabilités dans le groupe',{lead:3}],['Découvrir jusqu’où mon potentiel peut m’emmener',{cur:2,auto:2,perf:2}]]],
['RUGBY & PERFORMANCE','Si le rugby de haut niveau devient difficile à atteindre, quelle réaction te ressemble le plus ?',[['Je veux tout de même aller le plus loin possible.',{perf:3}],['Je cherche un autre environnement où la compétition me stimule.',{perf:2,cur:2}],['Je garde le rugby comme passion et construis autre chose.',{auto:3,ana:1}],['Je pourrais avoir envie d’entraîner ou de manager dans le sport.',{lead:3,coll:2}],['Je veux comprendre ce qui m’a manqué et apprendre de l’expérience.',{cur:3,ana:2}]]],
['ÉTUDES','À l’école, ce qui te donne le plus de satisfaction est…',[['Réussir un raisonnement difficile',{ana:3}],['Produire quelque chose d’original',{crea:3}],['Écrire et défendre une idée',{impact:2,cur:2}],['Obtenir une très bonne performance',{perf:3}],['Comprendre un sujet en profondeur',{cur:3,ana:1}]]],
['ÉTUDES','Pour tes études après le lycée, qu’est-ce qui t’attire le plus ?',[['Une formation très exigeante qui ouvre beaucoup de portes',{ana:2,perf:3}],['Un parcours qui me permet de construire des projets',{auto:3,crea:2}],['Une formation scientifique ou technologique',{ana:3,cur:2}],['Une formation orientée business, stratégie ou management',{lead:3,perf:1}],['Je veux encore explorer avant de choisir',{cur:3,auto:2}]]],
['TON FUTUR','Imagine une journée de travail idéale à 30 ans. Qu’est-ce qui compte le plus ?',[['Une équipe à diriger',{lead:3,coll:2}],['Des problèmes difficiles à résoudre',{ana:3,cur:2}],['Créer et décider de ma propre façon de travailler',{auto:3,crea:1}],['Un environnement très compétitif',{perf:3}],['Un travail utile et qui a du sens',{impact:3,coll:1}]]],
['TON FUTUR','Dans une équipe professionnelle, tu aimerais plutôt être…',[['Le spécialiste que tout le monde consulte',{ana:3}],['Le responsable qui fixe la direction',{lead:3}],['Celui qui invente les nouvelles idées',{crea:3}],['Celui qui fait avancer tout le monde',{coll:3,lead:1}],['Celui qui négocie et représente l’équipe',{impact:2,lead:2}]]],
['TON FUTUR','Qu’aimerais-tu surtout avoir réussi à 30 ans ?',[['Être reconnu comme excellent dans mon domaine',{perf:2,ana:2}],['Avoir créé quelque chose qui existe grâce à moi',{crea:2,auto:3}],['Diriger une équipe ou une organisation',{lead:3}],['Avoir une vie très libre',{auto:3}],['Avoir un impact positif sur les autres',{impact:3,coll:1}]]]
];
const TEXT=[['TON FUTUR','Décris une journée de travail idéale à 30 ans. Où es-tu ? Avec qui ? Que fais-tu ? Qui décide ? Qu’est-ce qui te rend fier ?'],['TOI','Choisis une personne que tu admires et explique précisément ce que tu admires chez elle.'],['TOI','Qu’est-ce que tu penses que tes parents ne comprennent pas encore sur toi ou sur ce que tu pourrais vouloir faire plus tard ?'],['TOI','Si tu pouvais essayer n’importe quelle activité pendant un mois sans risque d’échec, laquelle choisirais-tu ? Pourquoi ?']];
const N={ana:['Analyse & Réflexion','🧠'],auto:['Autonomie','🪽'],perf:['Défi & Performance','🚀'],crea:['Créativité','💡'],impact:['Impact & Sens','💗'],lead:['Leadership','👑'],coll:['Collectif','👥'],cur:['Curiosité','🔎']};let A=JSON.parse(localStorage.mo_v4||'{}'),step=0;
function save(){localStorage.mo_v4=JSON.stringify(A)}function start(){step=1;render()}function nav(){return '<div class="nav"><button class="back" onclick="prev()">‹</button><button class="primary" onclick="next()">Suivant&nbsp; →</button></div>'}function render(){document.getElementById('bar').style.width=(step/(Q.length+TEXT.length)*100)+'%';if(step===0){home();return}if(step>Q.length+TEXT.length){results();return}if(step<=Q.length){let q=Q[step-1],sel=A['q'+(step-1)];document.getElementById('s').innerHTML='<section class="card"><div class="kicker">'+q[0]+'</div><h1 class="title">'+q[1]+'</h1>'+q[2].map((o,i)=>'<button class="choice '+(sel===i?'sel':'')+'" onclick="pick('+i+')"><div class="ci">'+['🎯','💡','🧠','🚀','👥'][i%5]+'</div><div><b>'+o[0]+'</b></div></button>').join('')+'<div class="hint">Choisis spontanément. Il n’y a pas de bonne réponse.</div>'+nav()+'</section>'}else{let t=TEXT[step-Q.length-1],k='t'+(step-Q.length-1);document.getElementById('s').innerHTML='<section class="card"><div class="kicker">'+t[0]+'</div><h1 class="title">'+t[1]+'</h1><textarea class="textarea" id="txt" placeholder="Écris librement…">'+(A[k]||'')+'</textarea><div class="hint">Cette réponse libre n’est pas transformée automatiquement en score.</div>'+nav()+'</section>'}}
function home(){document.getElementById('bar').style.width='0%';document.getElementById('s').innerHTML='<section class="card hero"><div class="logo">🧭</div><div class="kicker">MISSION ORIENTATION · V4</div><h1>Connais-toi.<br><span class="gradient">Explore.</span><br>Choisis ton chemin.</h1><p class="tagline">Un parcours interactif pour comprendre ce qui te motive et explorer ton avenir.</p><div class="feature"><div class="ico">🎯</div><div><b>4 grands axes</b><span>Pour mieux te comprendre</span></div></div><div class="feature"><div class="ico">🚀</div><div><b>Mises en situation</b><span>Des choix concrets</span></div></div><div class="feature"><div class="ico">📊</div><div><b>Analyse personnalisée</b><span>Tes forces et pistes d’exploration</span></div></div><div class="privacy">🛡️ <b>Confidentiel</b><br>Tes réponses restent sur ton appareil. Tu décides si tu veux les partager.</div><button class="primary" onclick="start()">Commencer</button><button class="secondary" onclick="privacy()">En savoir plus</button></section>'}
function pick(i){A['q'+(step-1)]=i;save();render()}function next(){if(step>Q.length){let x=document.getElementById('txt');A['t'+(step-Q.length-1)]=x?x.value:'';save()}step++;render()}function prev(){if(step>1){if(step>Q.length){let x=document.getElementById('txt');A['t'+(step-Q.length-1)]=x?x.value:'';save()}step--;render()}}
function calc(){let s={ana:0,auto:0,perf:0,crea:0,impact:0,lead:0,coll:0,cur:0};Q.forEach((q,i)=>{let n=A['q'+i];if(n!=null)Object.entries(q[2][n][1]).forEach(([k,v])=>s[k]+=v)});let mx=Math.max(...Object.values(s),1);Object.keys(s).forEach(k=>s[k]=Math.round(s[k]/mx*100));return s}
function rec(s){let r=[['🧬 Sciences & Technologies','Ingénierie, IA, data, recherche…',s.ana*.7+s.cur*.3],['📈 Stratégie & Management','Conseil, gestion de projet, entrepreneuriat…',s.lead*.45+s.perf*.3+s.auto*.25],['💼 Finance & Économie','Finance, audit, analyse, économie…',s.ana*.45+s.perf*.35+s.auto*.2],['🎨 Création & Design','Design, architecture, médias, communication…',s.crea*.7+s.auto*.3],['⚖️ Droit & Relations','Droit, négociation, diplomatie, affaires publiques…',s.impact*.35+s.lead*.35+s.cur*.3],['🏉 Sport & Performance','Sport de haut niveau, management sportif…',s.perf*.55+s.coll*.25+s.lead*.2]];return r.sort((a,b)=>b[2]-a[2]).slice(0,4)}
function results(){let s=calc(),ord=Object.keys(s).sort((a,b)=>s[b]-s[a]),r=rec(s),rug=Math.round(s.perf*.55+s.coll*.25+s.lead*.2),stud=Math.round(s.ana*.45+s.cur*.2+s.auto*.2+s.perf*.15);document.getElementById('bar').style.width='100%';document.getElementById('s').innerHTML='<section class="card"><div class="kicker">RÉSULTATS</div><h1 class="title">Ta carte du moment</h1><p class="sub">Tes moteurs actuels. Ce n’est ni une note ni un métier imposé.</p>'+ord.map(k=>'<div class="meter"><div class="meterrow"><span>'+N[k][1]+' '+N[k][0]+'</span><b>'+s[k]+'%</b></div><div class="track"><div class="fill" style="width:'+s[k]+'%"></div></div></div>').join('')+'<h3>✨ Tes forces clés</h3>'+ord.slice(0,5).map(k=>'<span class="pill">'+N[k][0]+'</span>').join('')+'</section><section class="card"><div class="kicker">PISTES D’ORIENTATION</div><h2>Des domaines à explorer</h2><p class="sub">Des terrains cohérents avec tes réponses, à découvrir avant de choisir.</p>'+r.map(x=>'<div class="recommend"><b>'+x[0]+' · '+Math.round(x[2])+'%</b><span>'+x[1]+'</span></div>').join('')+'</section><section class="card"><div class="kicker">TON DOUBLE PROJET</div><h2>🏉 Rugby & 📚 études</h2><p class="sub">Tu n’as pas besoin de choisir aujourd’hui. L’objectif est de faire progresser les deux projets et de garder des portes ouvertes.</p><div class="dual"><div class="recommend"><b>Rugby</b><span>Engagement potentiel : '+Math.min(99,rug)+'%</span><div class="track" style="margin-top:9px"><div class="fill" style="width:'+Math.min(99,rug)+'%;background:linear-gradient(90deg,#22d3ee,#84cc16)"></div></div></div><div class="recommend"><b>Études</b><span>Exploration académique : '+Math.min(99,stud)+'%</span><div class="track" style="margin-top:9px"><div class="fill" style="width:'+Math.min(99,stud)+'%"></div></div></div></div></section><section class="card"><div class="kicker">À TOI DE DÉCIDER</div><h2>Partager ton profil ?</h2><p class="sub">Tu peux exporter un fichier JSON et le donner à tes parents, ou le garder privé.</p><button class="primary" onclick="exportData()">Exporter mes réponses</button><button class="secondary" onclick="restart()">Recommencer</button><div class="foot">Mission Orientation V4 · aucune réponse n’est envoyée à un serveur.</div></section>'}
function exportData(){let d={version:'V4',exportedAt:new Date().toISOString(),answers:A,profile:calc()};let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mission-orientation-v4.json';a.click()}function restart(){if(confirm('Recommencer effacera les réponses enregistrées sur cet appareil.')){localStorage.removeItem('mo_v4');A={};step=0;render()}}function privacy(){alert('CONFIDENTIALITÉ\n\nCette mini-app ne transmet pas tes réponses à un serveur. Elles restent dans le stockage local du navigateur. Tu peux les exporter uniquement si tu le souhaites.')}render();
</script></body></html>
